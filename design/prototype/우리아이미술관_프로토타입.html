<title>우리 아이 미술관 프로토타입</title>
<meta name="description" content="SD_02 UI/UX 설계서의 S1~S12 화면을 스타일가이드 토큰으로 구현한 클릭 프로토타입">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400&family=Noto+Sans+KR:wght@300..700&display=swap" rel="stylesheet">
<style>
/* 토큰 — design/style-guide/DESIGN.md 값 그대로. 흑백 프레임 단일 테마(스타일가이드 결정) */
:root{
  --color-primary:#000; --color-on-primary:#fff; --color-ink:#000; --color-canvas:#fff;
  --color-inverse-canvas:#000; --color-inverse-ink:#fff;
  --color-hairline:#e6e6e6; --color-hairline-soft:#f1f1f1; --color-surface-soft:#f7f7f5;
  --color-block-lime:#dceeb1; --color-block-lilac:#c5b0f4; --color-block-cream:#f4ecd6;
  --color-block-pink:#efd4d4; --color-block-mint:#c8e6cd; --color-block-coral:#f3c9b6;
  --color-block-navy:#1f1d3d; --color-accent-magenta:#ff3d8b; --color-semantic-success:#1ea64a;
  --font-sans:"Inter","Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Menlo,"Noto Sans KR",monospace;
  --r-xs:2px; --r-sm:6px; --r-md:8px; --r-lg:24px; --r-xl:32px; --r-pill:50px; --r-full:9999px;
  --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:24px; --s-xl:32px; --s-xxl:48px; --s-section:96px;
  --elev-2:0 4px 16px rgba(0,0,0,.06); --elev-3:0 16px 48px rgba(0,0,0,.18);
  --gutter:var(--s-xxl);
  color-scheme:light;
}
@media (max-width:768px){:root{--gutter:var(--s-md)}}
*{box-sizing:border-box}
body{margin:0;background:var(--color-canvas);color:var(--color-ink);font:320 18px/1.45 var(--font-sans);letter-spacing:-.26px;overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--color-ink);outline-offset:3px}
.container{max-width:1280px;margin:0 auto;padding-inline:var(--gutter)}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}

/* 타이포 역할 */
.t-display{font:340 56px/1.08 var(--font-sans);letter-spacing:-.9px}
.t-headline{font:540 26px/1.35 var(--font-sans);letter-spacing:-.26px}
.t-card-title{font:700 22px/1.4 var(--font-sans);letter-spacing:0}
.t-body-lg{font:330 20px/1.40 var(--font-sans);letter-spacing:-.14px}
.t-body-sm{font:330 16px/1.45 var(--font-sans);letter-spacing:-.14px}
.t-eyebrow{font:400 15px/1.3 var(--font-mono);letter-spacing:.54px;text-transform:uppercase}
.t-caption{font:400 12px/1.2 var(--font-mono);letter-spacing:.6px;text-transform:uppercase}
@media (max-width:560px){.t-display{font-size:38px;letter-spacing:-.5px}.t-headline{font-size:22px}}

/* ---------- 프로토타입 바 (제품 UI 밖) ---------- */
.proto{background:var(--color-inverse-canvas);color:var(--color-inverse-ink);font:330 14px/1.4 var(--font-sans)}
.proto .container{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:8px}
.proto label{display:flex;gap:8px;align-items:center}
.proto select{background:#000;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-pill);padding:4px 10px;max-width:100%}
.proto .scen{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.proto .scen button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-pill);padding:3px 10px;cursor:pointer;font-size:13px}
.proto .scen button[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.proto .reset{margin-left:auto;background:transparent;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}

/* ---------- C9 셸 헤더 ---------- */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--color-canvas);border-bottom:1px solid var(--color-hairline-soft)}
.shell .container{min-height:60px;display:flex;align-items:center;gap:var(--s-md);flex-wrap:wrap;padding-block:8px}
.wordmark{font:540 19px/1 var(--font-sans);letter-spacing:-.4px;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.shell .who{font:400 12px/1 var(--font-mono);letter-spacing:.6px;text-transform:uppercase;border:1px solid var(--color-hairline);border-radius:var(--r-pill);padding:6px 10px;white-space:nowrap}
.shell nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.shell nav button{background:var(--color-canvas);border:0;border-radius:var(--r-full);padding:8px 12px;font:330 16px/1.3 var(--font-sans);cursor:pointer}
.shell nav button:hover{background:var(--color-surface-soft)}
.shell nav button[aria-current="page"]{background:var(--color-primary);color:var(--color-on-primary)}

main{padding-block:var(--s-xl) var(--s-section)}
.page-head{display:grid;gap:var(--s-xs);margin-bottom:var(--s-lg)}
.stack{display:grid;gap:var(--s-md)}
.stack-lg{display:grid;gap:var(--s-lg)}
.row-flex{display:flex;flex-wrap:wrap;gap:var(--s-sm);align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-lg)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-md)}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
@media (max-width:640px){.grid3{grid-template-columns:1fr}}

/* ---------- 버튼 ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;min-height:44px;border-radius:var(--r-pill);font:480 18px/1.35 var(--font-sans);letter-spacing:-.1px;text-decoration:none;padding:9px 20px;text-align:center;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--color-primary);color:var(--color-on-primary)}
.btn-secondary{background:var(--color-canvas);color:var(--color-ink);box-shadow:inset 0 0 0 1px var(--color-hairline)}
.btn-tertiary{background:transparent;color:var(--color-ink);padding:8px 10px;text-decoration:underline;text-underline-offset:4px}
.btn-sm{min-height:36px;font-size:15px;padding:6px 14px}
/* C3 이유 달린 비활성 버튼 */
.btn[aria-disabled="true"]{background:var(--color-surface-soft);color:var(--color-ink);box-shadow:inset 0 0 0 1px var(--color-ink);cursor:not-allowed;flex-direction:column;gap:0;border-radius:var(--r-lg);padding:8px 18px;background-image:repeating-linear-gradient(135deg,transparent 0 8px,rgba(0,0,0,.05) 8px 9px)}
.btn[aria-disabled="true"] .why{font:330 13px/1.35 var(--font-sans)}
.btn[aria-disabled="true"]:active{transform:none}
.btn[aria-disabled="true"]:hover::after,.btn[aria-disabled="true"]:focus-visible::after{content:attr(data-reason);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--color-inverse-canvas);color:var(--color-inverse-ink);font:330 14px/1.4 var(--font-sans);padding:6px 10px;border-radius:var(--r-sm);white-space:nowrap;box-shadow:var(--elev-2);z-index:5;pointer-events:none}

/* ---------- C1 진행 레일 ---------- */
.rail{border:1px solid var(--color-hairline);border-radius:var(--r-lg);padding:var(--s-md) var(--s-lg);margin-bottom:var(--s-lg);display:grid;gap:var(--s-sm)}
.rail ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:2px}
.rail li{display:flex;align-items:center;gap:6px;white-space:nowrap;font:330 15px/1.3 var(--font-sans)}
.rail li+li::before{content:"";width:14px;height:1px;background:var(--color-ink);flex:none}
.rail .dot{width:9px;height:9px;border-radius:var(--r-full);border:1.5px solid var(--color-ink);flex:none}
.rail .done .dot{background:var(--color-ink)}
.rail .cur{background:var(--color-primary);color:var(--color-on-primary);border-radius:var(--r-pill);padding:5px 12px;font-weight:540}
.rail .cur .dot{border-color:#fff;background:#fff}
.rail .stuck{background:var(--color-canvas);color:var(--color-ink);box-shadow:inset 0 0 0 2px var(--color-ink);border-radius:var(--r-pill);padding:5px 12px;font-weight:540}
.rail .stuck .dot{border-radius:0;transform:rotate(45deg);background:var(--color-ink)}
.rail .gate-id{font:400 11px/1 var(--font-mono);letter-spacing:.5px;border:1px solid currentColor;border-radius:var(--r-sm);padding:3px 5px}
.rail .foot{display:flex;flex-wrap:wrap;gap:var(--s-sm);align-items:center;font:330 15px/1.4 var(--font-sans)}
.rail.terminal{box-shadow:inset 0 0 0 2px var(--color-ink);border-color:var(--color-ink)}

/* ---------- C2 차단 블록 ---------- */
.gate{border:2.5px solid var(--color-ink);border-radius:var(--r-md);padding:var(--s-md) var(--s-lg);display:grid;gap:var(--s-sm);background:var(--color-canvas)}
.gate.hold{border-style:dashed}
.gate.final{background:var(--color-surface-soft)}
.gate:focus{outline:3px solid var(--color-ink);outline-offset:3px}
.gate-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:540 18px/1.35 var(--font-sans)}
.gate-tag{font:400 12px/1 var(--font-mono);letter-spacing:.6px;text-transform:uppercase;background:var(--color-primary);color:var(--color-on-primary);border-radius:var(--r-sm);padding:5px 7px}
.gate.hold .gate-tag{background:var(--color-canvas);color:var(--color-ink);box-shadow:inset 0 0 0 1px var(--color-ink)}
.gate-code{font:400 12px/1 var(--font-mono);letter-spacing:.6px;border:1px solid var(--color-ink);border-radius:var(--r-sm);padding:4px 6px}
.gate dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px var(--s-md);font:330 16px/1.45 var(--font-sans)}
.gate dt{font:400 12px/1.8 var(--font-mono);letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.gate dd{margin:0}
@media (max-width:480px){.gate dl{grid-template-columns:1fr;gap:2px}.gate dd{margin-bottom:8px}}

/* C4 상태 배지 */
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-ink);border-radius:var(--r-pill);padding:5px 10px;font:400 12px/1 var(--font-mono);letter-spacing:.5px;white-space:nowrap;background:var(--color-canvas)}
.badge .d{width:8px;height:8px;border-radius:var(--r-full);background:var(--color-ink);flex:none}
.badge.quiet{border-color:var(--color-hairline)} .badge.quiet .d{background:transparent;border:1px solid var(--color-ink)}
.badge.stuck{border-width:2px} .badge.stuck .d{border-radius:0;transform:rotate(45deg)}
.badge.del .d{border-radius:0;background:transparent;border:1.5px solid var(--color-ink)}
.badge.wait .d{background:transparent;border:1.5px dashed var(--color-ink)}

/* 표 */
.table-wrap{overflow-x:auto;border:1px solid var(--color-hairline);border-radius:var(--r-md)}
table{width:100%;border-collapse:collapse;font:330 16px/1.45 var(--font-sans)}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--color-hairline-soft);vertical-align:middle}
th{font:400 12px/1 var(--font-mono);letter-spacing:.6px;text-transform:uppercase;background:var(--color-surface-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--color-surface-soft)}
tr[aria-selected="true"] td{background:var(--color-surface-soft);font-weight:480}
tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--color-ink)}

/* 카드·타일·입력 */
.card{background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--r-lg);padding:var(--s-lg)}
.tile{background:var(--color-surface-soft);border-radius:var(--r-md);padding:var(--s-lg)}
.cb{border-radius:var(--r-lg);padding:var(--s-xl)}
.cb-cream{background:var(--color-block-cream)} .cb-lime{background:var(--color-block-lime)} .cb-coral{background:var(--color-block-coral)} .cb-mint{background:var(--color-block-mint)} .cb-lilac{background:var(--color-block-lilac)}
@media (max-width:768px){.cb{padding:var(--s-lg) var(--s-md)}}
.field{display:grid;gap:6px}
.field label{font:330 17px/1.4 var(--font-sans)}
.input,select.input{width:100%;background:var(--color-canvas);padding:11px 14px;min-height:48px;border:1px solid var(--color-hairline);border-radius:var(--r-md);font:320 18px/1.4 var(--font-sans)}
.input:focus{outline:none;box-shadow:0 0 0 2px var(--color-ink)}
.input.is-error{border-color:var(--color-ink);box-shadow:0 0 0 2px var(--color-ink)}
.hint{font:330 15px/1.45 var(--font-sans)}
.hint.err::before{content:"◆ ";font-size:11px}
.note{border-left:2px solid var(--color-ink);padding:8px 14px;background:var(--color-surface-soft);border-radius:0 var(--r-md) var(--r-md) 0;font:330 16px/1.45 var(--font-sans)}
.done-line{display:flex;gap:10px;align-items:center;border:1px solid var(--color-ink);border-radius:var(--r-md);padding:10px 14px;font:480 16px/1.4 var(--font-sans)}
.done-line .ck{color:var(--color-semantic-success);font-weight:700}
.sectitle{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-sm);flex-wrap:wrap}

/* 작품 그림 */
.art-fig{margin:0;aspect-ratio:4/3;max-width:100%;border-radius:var(--r-md);background:var(--color-canvas);display:grid;place-items:center;overflow:hidden;position:relative;border:1px solid var(--color-hairline)}
.art-fig svg{width:76%;height:76%;overflow:visible}
.art-fig .cap{position:absolute;left:10px;top:10px}
.art-fig.fail{background:var(--color-surface-soft);border:2px dashed var(--color-ink)}
.art-fig.fail p{padding:var(--s-md);text-align:center;font:330 16px/1.45 var(--font-sans)}
.layer{transition:transform .25s ease-out}
.playing .mover{animation:bob 1s ease-in-out 3}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(6px,-8px) rotate(3deg)}75%{transform:translate(-6px,-4px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.playing .mover{animation:none}.layer{transition:none}}

/* C3 선택 카드 (S3) */
.opt{display:grid;gap:10px;text-align:left;border:1px solid var(--color-hairline);border-radius:var(--r-lg);background:var(--color-canvas);padding:var(--s-lg);cursor:pointer;min-height:150px;align-content:start}
.opt:hover{border-color:var(--color-ink)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--color-ink);border-color:var(--color-ink)}
.opt .radio{width:22px;height:22px;border-radius:var(--r-full);border:1.5px solid var(--color-ink);display:grid;place-items:center}
.opt[aria-checked="true"] .radio::after{content:"";width:12px;height:12px;border-radius:var(--r-full);background:var(--color-ink)}
.opt b{font:700 20px/1.35 var(--font-sans)}

/* C7 이야기 카드 · AI 표시 */
.ai-mark{display:inline-block;font:400 12px/1 var(--font-mono);letter-spacing:.6px;text-transform:uppercase;border:1px solid var(--color-ink);border-radius:var(--r-sm);padding:4px 6px}
.quote{font:330 22px/1.4 var(--font-sans);letter-spacing:-.14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-hairline);background:var(--color-canvas);border-radius:var(--r-pill);padding:8px 14px;font:480 16px/1.3 var(--font-sans);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}

/* C8 전시 조건 체크 */
.cond{display:grid;gap:8px}
.cond button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--r-md);padding:12px 14px;font:330 16px/1.4 var(--font-sans);cursor:pointer}
.cond .box{width:22px;height:22px;border:1.5px solid var(--color-ink);border-radius:var(--r-xs);display:grid;place-items:center;flex:none;font-weight:700;font-size:15px}
.cond .ok .box{background:var(--color-ink);color:#fff}
.cond .ok{cursor:default}
.cond .miss{border-color:var(--color-ink)}

/* C10 모델 상태 칩 — 모양을 서로 다르게 */
.mchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--color-ink);border-radius:var(--r-pill);padding:5px 10px;font:400 12px/1 var(--font-mono);letter-spacing:.4px;white-space:nowrap}
.mchip i{width:10px;height:10px;display:inline-block;flex:none}
.mchip.ready i{border-radius:50%;background:var(--color-ink)}
.mchip.notready i{border-radius:50%;border:1.5px solid var(--color-ink)}
.mchip.off{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(0,0,0,.12) 5px 6px)} .mchip.off i{border:1.5px solid var(--color-ink);background:linear-gradient(135deg,transparent 45%,#000 45% 55%,transparent 55%)}
.mchip.cpu i{border-radius:50%;border:1.5px solid var(--color-ink);background:linear-gradient(90deg,#000 50%,transparent 50%)}
.mchip.hidden{border-style:dashed} .mchip.hidden i{border:1.5px dashed var(--color-ink)}
.mchip.unknown i::before{content:"?";font:700 11px/10px var(--font-sans);display:block;text-align:center}

/* 탭 */
.tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--color-hairline);border-radius:var(--r-pill);max-width:100%;overflow-x:auto}
.tab{border:0;background:var(--color-canvas);padding:7px 16px;border-radius:var(--r-pill);font:480 16px/1.4 var(--font-sans);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--color-primary);color:var(--color-on-primary)}

/* 가족 전시 */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s-md)}
.gal-item{background:var(--color-surface-soft);border-radius:var(--r-md);padding:var(--s-sm);display:grid;gap:8px;border:0;text-align:left;cursor:pointer}
.gal-item:hover .art-fig{border-color:var(--color-ink)}
.gal-item .title{font:700 18px/1.3 var(--font-sans)}
.age-head{display:flex;align-items:baseline;gap:var(--s-md);margin:var(--s-lg) 0 var(--s-sm)}

/* 대화상자 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:var(--s-md);z-index:50}
.dialog{background:var(--color-canvas);border-radius:var(--r-lg);box-shadow:var(--elev-3);padding:var(--s-xl);max-width:560px;width:100%;display:grid;gap:var(--s-md);max-height:90vh;overflow:auto}
.dialog ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font:330 16px/1.45 var(--font-sans)}

pre.code{margin:0;background:var(--color-surface-soft);border-radius:var(--r-md);padding:var(--s-md);overflow-x:auto;font:400 13px/1.6 var(--font-mono);letter-spacing:0}
code{font:400 .85em/1.4 var(--font-mono);background:var(--color-surface-soft);padding:1px 6px;border-radius:var(--r-sm);letter-spacing:0}
.summary-row{display:flex;flex-wrap:wrap;gap:var(--s-sm);align-items:center;border:1px solid var(--color-hairline);border-radius:var(--r-lg);padding:var(--s-sm) var(--s-lg);margin-bottom:var(--s-lg);font:330 16px/1.4 var(--font-sans)}
.summary-row .k{font:400 12px/1 var(--font-mono);letter-spacing:.6px;text-transform:uppercase}
.sep{width:1px;height:18px;background:var(--color-hairline)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--color-ink);border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer.proto-foot{border-top:1px solid var(--color-hairline-soft);padding-block:var(--s-lg);font:330 14px/1.5 var(--font-sans)}
</style>

<div class="proto" role="region" aria-label="프로토타입 조작">
  <div class="container">
    <strong style="font-weight:540">SD_02 프로토타입</strong>
    <label for="proto-screen">화면
      <select id="proto-screen"></select>
    </label>
    <div class="scen" id="proto-scen" aria-label="이 화면의 상태 보기"></div>
    <button class="reset" id="proto-reset" type="button">예시 데이터 초기화</button>
  </div>
</div>
<header class="shell" id="shell"></header>

function badge(st){

  return '<span class="badge '+cls+'"><span class="d"></span>'+esc(st)+(st==='처리하지 못함'?' · G9':'')+'</span>';
}
/* C1 */
function rail(st,opt){
  opt=opt||{};
  if(st==='삭제 중'){
    return '<section class="rail terminal" aria-label="진행"><ol><li class="stuck"><span class="dot"></span>삭제 중</li></ol><div class="foot">이 작품의 모든 조작이 잠겼어요 <span class="gate-code">BR-DEL-05</span></div></section>';
  }
  var steps=RAIL.slice(), cur=RAIL.indexOf(st), stuck=false;
  if(st==='처리하지 못함'){steps[4]='처리하지 못함';cur=4;stuck=true;}
  var li=steps.map(function(s,i){
    var c=i<cur?'done':(i===cur?(stuck||opt.hold?'stuck':'cur'):'');
    var extra='';
    if(i===cur&&stuck) extra=' <span class="gate-id">G9</span>';
    if(i===cur&&opt.wait) extra=' · 순서를 기다리는 중';
    if(s==='전시 중'&&opt.g12) extra=' <span class="gate-id">G12</span>';
    return '<li class="'+c+'"'+(i===cur?' aria-current="step"':'')+'><span class="dot"></span>'+esc(s)+extra+'</li>';
  }).join('');
  var foot='';
  if(stuck) foot='<div class="foot">서버 문제로 결과를 만들지 못했어요 <button class="btn btn-tertiary btn-sm" data-act="focus-gate">막힌 자리 보기</button></div>';
  else if(opt.wait) foot='<div class="foot">화면을 닫아도 계속돼요</div>';
  else if(opt.foot) foot='<div class="foot">'+opt.foot+'</div>';
  return '<section class="rail" aria-label="진행 단계"><ol>'+li+'</ol>'+foot+'</section>';
}
function journey(i){
  return '<section class="rail" aria-label="보호자 여정"><ol>'+JOURNEY.map(function(s,k){
    return '<li class="'+(k<i?'done':k===i?'cur':'')+'"'+(k===i?' aria-current="step"':'')+'><span class="dot"></span>'+s+'</li>';}).join('')+'</ol></section>';
}
/* C2 */
function gate(o){
  var kind=o.kind||'block';
  var tag=kind==='hold'?'보류 '+o.g:kind==='final'?'종결':'막힘 '+o.g;
  return '<section class="gate '+kind+'" id="'+(o.id||'gate')+'" tabindex="-1" role="alert" aria-labelledby="'+(o.id||'gate')+'-h">'+
    '<p class="gate-head" id="'+(o.id||'gate')+'-h"><span class="gate-tag">'+esc(tag)+'</span>'+esc(o.title)+(o.e?' <span class="gate-code">'+esc(o.e)+'</span>':'')+'</p>'+
    '<dl><dt>사유</dt><dd>'+esc(o.why)+'</dd><dt>해제 주체</dt><dd>'+esc(o.who)+'</dd><dt>다음 행동</dt><dd><div class="row-flex">'+(o.next||'')+'</div></dd></dl></section>';
}
/* C3 */
function btn(label,act,o){
  o=o||{};
  var cls='btn '+(o.cls||'btn-primary')+(o.sm?' btn-sm':'');
  if(o.off){
    return '<button type="button" class="'+cls+'" aria-disabled="true" data-reason="'+esc(o.off)+'" data-act="disabled" data-gate="'+(o.gate||'gate')+'">'+esc(label)+'<span class="why">(비활성) - '+esc(o.off)+'</span></button>';
  }
  return '<button type="button" class="'+cls+'" data-act="'+act+'"'+(o.arg!=null?' data-arg="'+esc(o.arg)+'"':'')+'>'+esc(label)+'</button>';
}

  's7-tag':function(k){tmp.s7.tags[k]=!tmp.s7.tags[k];var b=$('[data-act="s7-tag"][data-arg="'+k+'"]');b.setAttribute('aria-pressed',tmp.s7.tags[k]);s7live();},
  's7-make':function(){

      else{t.n++;t.draft=a.story.age+'살 때 '+t.kw.split(',')[0].trim()+' 나온 '+picked.join('와 ')+'를 그렸어요.'+(t.n>1?' 나무 아래 그늘이 시원해 보여요.':'');t.src='llm';}
      s7live();
    },1300);
  },
  's7-template':function(){var a=pick(S.sel.s7,'a2');tmp.s7.draft=a.story.age+'살 때 그린 「'+(a.story.title||a.title)+'」이에요.';tmp.s7.src='template';tmp.s7.fail=false;s7live();},
  's7-direct':function(){tmp.s7.direct=true;tmp.s7.draft='';tmp.s7.src='direct';render(false);var d=$('#s7-direct');if(d)d.focus();},
  's7-approve':function(){var a=pick(S.sel.s7,'a2');var ta=$('#s7-direct')||$('#s7-draft');var v=ta?ta.value.trim():'';if(!v){ta&&ta.focus();announce('설명을 적어 주세요');return;}
    a.caption={text:v,src:tmp.s7.src};S.notice.s6=a.status==='전시 중'?'설명을 승인했어요. 전시에 곧바로 보여요':'설명을 승인했어요. 전시될 때 함께 보여요';S.sel.s6=a.id;go('s6');},
  /* S8 */
  's8-child':function(id){S.s8child=id;render(false);},
  's8-open':function(id){S.sel.s8=id;tmp.s8play=false;tmp.s8orig=false;render(true);},
  's8-back':function(){S.sel.s8=null;render(false);},
  's8-toggle':function(){tmp.s8play=!tmp.s8play;render(false);if(tmp.s8play)startMotion('#s8-res','s8play');},
  's8-orig':function(){tmp.s8orig=!tmp.s8orig;tmp.s8play=false;render(false);},
  /* S9 */
  's9-go':function(){
    var sc=scen.s9||'artwork';
    if(sc==='g18'&&!tmp.s9retry){tmp.s9='g18';render(false);focusGate();return;}
    if(sc==='child'){var cid=tmp.s9child||(S.children[1]||S.children[0]).id;S.arts=S.arts.filter(function(a){return a.child!==cid;});S.children=S.children.filter(function(c){return c.id!==cid;});tmp.s9='done';render(false);return;}
    var a=pick(S.sel.s9,'a3');a.status='삭제 중';a.stage='삭제 중';tmp.s9a=a;
    if(S.sel.s4===a.id) S.sel.s4=null;
    tmp.s9='hold';render(false);announce('삭제를 시작했어요');
    setTimeout(function(){S.arts=S.arts.filter(function(x){return x.id!==a.id;});if(S.screen==='s9'&&tmp.s9==='hold'&&tmp.s9a===a){tmp.s9='deleted';render(false);announce('삭제했어요');}},3500);
  },
  's9-retry':function(){tmp.s9retry=true;tmp.s9='confirm';render(false);},

  /* S10 */
  's10-tab':function(t){S.s10tab=t;render(false);},

  's11-reeval':function(){var m=S.models.m1;if(m.busy||m.done>=m.total)return;m.busy=true;render(false);var iv=setInterval(function(){m.done=Math.min(m.done+1,m.total);if(m.done>=m.total){clearInterval(iv);m.busy=false;}if(S.screen==='s11')render(false);},900);},
  's11-rep':function(){tmp.s11rep=!tmp.s11rep;render(false);},
  's11-judge':function(){tmp.s11judge=true;render(false);},
  's11-req':function(){S.notice.s11='해시 · 격리 확인 뒤 항목별 평가 작업을 등록했어요';render(false);},
  's11-promote':function(){var m=S.models.m1;m.rollback=m.active;m.active=m.cand;m.cand=null;S.notice.s11='M1 '+m.active+'를 활성으로 올렸어요. '+m.rollback+'는 롤백 후보가 됐어요';render(false);},
  's11-rollback':function(){var m=S.models.m1;m.cand=m.active;m.active=m.rollback;m.rollback=null;m.done=m.total;S.notice.s11='M1을 '+m.active+'로 되돌렸어요';render(false);},

  's12-tab':function(t){S.s12tab=t;render(false);},
  's12-reload':function(){var d=new Date();tmp.s12read=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);render(false);},

function curS5(){return (scen.s5||'lowered')==='g9'?pick('a1','a2'):pick(S.sel.s5,'a2');}
function decide(kind){
  var a=curS5(); if(!a) return;
  a.status='승인됨'; a.result=kind==='frame'?'frame':(tmp.s5kind||a.result||'relief');
  a.stage='승인됨'; a.lowered=null;
  var filled=a.story&&a.story.title&&a.story.date&&a.story.age;
  if(filled){a.status='전시 중';a.stage='전시 중';S.notice.s6='승인했어요. 이야기가 갖춰져 있어 전시에 걸렸어요';}
  else S.notice.s6='승인했어요. 이야기를 채우면 전시돼요';
  S.sel.s6=a.id; scen.s6='actual'; go('s6');
}
/* 재생·시차 — 누를 때만. 움직임은 3회 뒤 정지(자동 반복 없음) */
function startMotion(sel,flag){
  var fig=$(sel); if(!fig) return;
  var kind=fig.getAttribute('data-kind');
  if(kind==='move'){
    fig.classList.add('playing');
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){ if(tmp[flag]){tmp[flag]=false;render(false);} }, reduce?600:3100);
  } else if(kind==='relief'){
    var back=fig.querySelector('.back'), front=fig.querySelector('.front');
    fig.addEventListener('pointermove',function(e){
      if(!tmp[flag]) return;
      var r=fig.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      if(back) back.style.transform='translate('+(x*-8)+'px,'+(y*-6)+'px)';
      if(front) front.style.transform='translate('+(x*14)+'px,'+(y*10)+'px)';
    });
    if(front) front.style.transform='translate(6px,-4px)';
  }
}

/* ================= 이벤트 ================= */
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'));return;}
  var s=e.target.closest('[data-scen]');
  if(s){var sid=S.screen;scen[sid]=s.getAttribute('data-scen');tmp={};if(sid==='s8')S.sel.s8=null;
    if(sid==='s6'){var tgt={approved:'a8',future:'a8',pending:'a2'}[scen.s6];if(art(tgt))S.sel.s6=tgt;}
    render(false);return;}
  var b=e.target.closest('[data-act]'); if(!b) return;
  var act=b.getAttribute('data-act'); if(!act||!A[act]) return;
  e.preventDefault();
  A[act](b.getAttribute('data-arg'),b);
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){e.preventDefault();A[e.target.getAttribute('data-act')](e.target.getAttribute('data-arg'),e.target);}
  if(e.key==='Escape'&&$('#modal-root').innerHTML){ if(S.screen==='s9'&&(tmp.s9||'confirm')==='confirm') A['s9-cancel'](); else $('#modal-root').innerHTML=''; }
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='s1-alias'){tmp.s1alias=e.target.value;s1live();}
  else if(id==='s6-title'||id==='s6-date'||id==='s6-age'||id==='s6-words'){tmp.s6[id.slice(3)]=e.target.value;s6live();}
  else if(id==='s7-kw'){tmp.s7.kw=e.target.value;s7live();}
  else if(id==='s8-q'){tmp.s8q=e.target.value;var p=e.target.selectionStart;render(false);var q=$('#s8-q');q.focus();try{q.setSelectionRange(p,p);}catch(x){}}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='proto-screen'){ scen={};go(e.target.value); }
  else if(id==='s2-child'){tmp.s2child=e.target.value;}
  else if(id==='s2-file'){var f=e.target.files[0];if(f){tmp.s2file=[f.name,f.type||'',Math.round(f.size/1048576*10)/10];tmp.s2g6=false;tmp.s2art='dog';s2live();}}
  else if(id==='s12-fn'){S.s12.fn=e.target.value;S.s12.res=null;s12live();}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.getAttribute('data-form');
  if(f==='login-parent'){S.role='parent';go('s4');}
  else if(f==='s1'){var b=$('#s1-live [data-act="s1-save"]');if(b)A['s1-save']();else focusGate();}
  else if(f==='s6'){A['s6-save']();}
});
$('#proto-reset').addEventListener('click',function(){S=seed();scen={};tmp={};go(S.screen==='login'?'login':S.screen);});

var start=(location.hash||'').replace('#','');
S.screen='';
go(R[start]?start:'s4');
})();
</script>
