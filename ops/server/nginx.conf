# nginx 라우팅(T009, research R-02·R-06) — Homebrew nginx 네이티브. server 블록만 둔다(include로 불러 쓴다).
# TorchServe 9561~9563, Ollama 11434, llm-server 8200, /internal/* 는 내보내지 않는다(BR-SRV-04).
# 팀 포트(D19): 입구 9501(web/dist) → app-api 9521 · model-api 9541.
server {
    listen 9501 ssl;
    server_name _;
    ssl_certificate     /opt/homebrew/etc/nginx/uam.crt;   # 팀 서버 인증서로 교체
    ssl_certificate_key /opt/homebrew/etc/nginx/uam.key;
    client_max_body_size 21m;                               # 20MB + 여유(BR-INT-01)
    # 본문 상한 초과 — nginx 기본 HTML 대신 계약 PayloadTooLarge(problem+json) (2026-09-30 점검, DEPLOY §7)
    error_page 413 = @too_large;
    location @too_large {
        types { } default_type application/problem+json;
        return 413 '{"type":"about:blank#payload_too_large","title":"payload_too_large","status":413,"code":"payload_too_large","reason":"too_large","detail":"보낸 내용이 너무 큽니다. 이미지는 20MB 이하로 줄여 다시 보내 주세요."}';
    }

    root /srv/uam/web/dist;
    location / { try_files $uri /index.html; }
    # 사진 자산(SD_04 §3-3): 면 사진은 이름이 바뀌어야 내용이 바뀐다 → 1년 immutable, 목록만 매번 확인. 없는 사진은 웹 화면으로 떨어지지 않게 404
    location = /museum/photos/manifest.json { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location ^~ /museum/photos/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

    # ^~ — 아래 정규식 location(/v1/…)보다 먼저 잡는다. 없으면 모델 요청이 app-api로 간다(ops/p1/nginx.conf와 같음)
    location ^~ /v1/models/ { proxy_pass http://127.0.0.1:9541; proxy_set_header X-Forwarded-For $remote_addr; }
    location ~ ^/(v1/|live$|ready$|openapi\.json$) { proxy_pass http://127.0.0.1:9521; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:9521; }
    location /internal/ { return 404; }
    # 수업 점검표의 외부 모델 API 주소(C2·E1). 공개 범위 팀 결정 전에는 404 — SPA 대체(index.html 200)로 떨어지면 거짓 통과(SD_04 §내부망 배치)
    location ~ ^/model-api(/|$) {
        types { } default_type application/problem+json;   # .json 확장자 MIME이 덮지 않게
        return 404 '{"type":"about:blank#not_found","title":"not_found","status":404,"code":"not_found","reason":"model_api_not_public"}';
    }

    # 가족 파일 — app-api가 X-Accel-Redirect로만 넘긴다(직접 접근 불가)
    location /_files/ { internal; alias /srv/uam/store/; }
}
