server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /v1/models/ { proxy_pass http://model-api:9541; }
    location ^~ /v1/files/ {
        proxy_pass http://app-api:9521;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store" always;
    }
    location /v1/ { proxy_pass http://app-api:9521; }
    location = /live { proxy_pass http://app-api:9521; }
    location = /ready { proxy_pass http://app-api:9521; }
    location / { try_files $uri $uri/ /index.html; }
}
