# 입구(SD_04 10-3). 팀 서버 설정(ops/p1/nginx.conf)과 같은 길 나누기를 서비스 이름으로 한다.
# 대상 이름은 요청 때 찾는다(resolver) — api·model-api가 아직 안 떠도 nginx가 뜬다.
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;                       # 접속 기록 대신 앱 로그가 허용 목록만 남긴다(BR-PRV-01)
    client_max_body_size 21m;             # 사진 20MB + 여유(BR-INT-01)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://app-api:9521;
    set $mapi http://model-api:9541;

    root /usr/share/nginx/html;
    location / { try_files $uri /index.html; }
    location = /version.json { add_header Cache-Control "no-store" always; try_files $uri =404; }

    location ^~ /v1/models/ {
        proxy_pass $mapi;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location ~ ^/(v1/|live$|ready$|openapi\.json$) {
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location = /metrics { return 404; }
    location /internal/ { return 404; }
    location ~ ^/model-api(/|$) { return 404; }
}
