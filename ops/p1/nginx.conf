# p1.sumzip.com 입구(ops/DEPLOY.md §7, D19 9501) — pioneer1 계정의 nginx 인스턴스. 공유 nginx(p01.conf)가 TLS를 풀고 여기로 넘긴다.
# 기동: nginx -p <저장소>/.data/p1-nginx -c <저장소>/ops/p1/nginx.conf -g 'daemon off;'  (pm2가 ops/p1/ecosystem.cjs로 띄움)
# 경로는 저장소 /Users/pioneer1/project2610 기준(다른 곳에 배포하면 바꾼다).
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 256; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;                                         # 접속 기록을 남기지 않는다(BR-PRV-01, 앱 로그가 허용 목록으로 남김)
    client_body_temp_path temp/body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    sendfile on;
    server_tokens off;

    server {
        listen 9501;
        server_name _;
        client_max_body_size 21m;                           # 20MB + 여유(BR-INT-01)

        # 공유 nginx(같은 호스트 192.168.0.19)가 넘긴 실제 접속 IP — 요청 한도(G26·G27)가 이 값을 본다
        set_real_ip_from 192.168.0.19;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # 첫 화면: SD_02 클릭 프로토타입. 웹 배포 뒤에는 root를 .data/p1-web(배포 복사본)로 바꾼다(DEPLOY §7)
        root /Users/pioneer1/project2610/design/prototype/share;
        location / { try_files $uri /index.html; }

        location ^~ /v1/models/ { proxy_pass http://127.0.0.1:9541; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; proxy_read_timeout 120s; }
        location ~ ^/(v1/|live$|ready$|openapi\.json$) {
            proxy_pass http://127.0.0.1:9521;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $host;
        }
        location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:9521; }
        location /internal/ { return 404; }
    }
}
