# p1.sumzip.com 입구(ops/server/DEPLOY.md §7, D19 9501) — pioneer1 계정의 nginx 인스턴스. 공유 nginx(p01.conf)가 TLS를 풀고 여기로 넘긴다.
# 기동: nginx -p <저장소>/.data/p1-nginx -c <저장소>/ops/p1/nginx.conf -g 'daemon off;'  (pm2가 ops/p1/ecosystem.cjs로 띄움)
# 경로는 저장소 /Users/pioneer1/project2610 기준(다른 곳에 배포하면 바꾼다).
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 256; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;                                         # 접속 기록을 남기지 않는다(BR-PRV-01, 앱 로그가 허용 목록으로 남김)
    client_body_temp_path temp/body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    sendfile on;
    server_tokens off;

    server {
        listen 9501;
        server_name _;
        client_max_body_size 21m;                           # 20MB + 여유(BR-INT-01)
        # 본문 상한 초과 — nginx 기본 HTML 대신 계약 PayloadTooLarge(problem+json) (2026-09-30 점검, DEPLOY §7)
        error_page 413 = @too_large;
        location @too_large {
            types { } default_type application/problem+json;
            return 413 '{"type":"about:blank#payload_too_large","title":"payload_too_large","status":413,"code":"payload_too_large","reason":"too_large","detail":"보낸 내용이 너무 큽니다. 이미지는 20MB 이하로 줄여 다시 보내 주세요."}';
        }

        # 공유 nginx(같은 호스트 192.168.0.19)가 넘긴 실제 접속 IP — 요청 한도(G26·G27)가 이 값을 본다
        set_real_ip_from 192.168.0.19;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # 첫 화면: main 커밋으로 빌드한 웹(ops/p1/deploy-web.sh → .data/p1-web). 프로토타입은 절대 연결하지 않는다(DEPLOY §7)
        root /Users/pioneer1/project2610/.data/p1-web;
        location / { try_files $uri /index.html; }
        location = /DEPLOYED_COMMIT { return 404; }
        # 사진 자산(SD_04 §3-3): 면 사진은 이름이 바뀌어야 내용이 바뀐다 → 1년 immutable, 목록만 매번 확인. 없는 사진은 웹 화면으로 떨어지지 않게 404
        location = /museum/photos/manifest.json { add_header Cache-Control "no-cache" always; try_files $uri =404; }
        location ^~ /museum/photos/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

        location ^~ /v1/models/ { proxy_pass http://127.0.0.1:9541; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; proxy_read_timeout 120s; }
        location ~ ^/(v1/|live$|ready$|openapi\.json$) {
            proxy_pass http://127.0.0.1:9521;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $host;
        }
        location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:9521; }
        location /internal/ { return 404; }
        # 수업 점검표의 외부 모델 API 주소(C2·E1). 공개 범위 팀 결정 전에는 404 — SPA 대체(index.html 200)로 떨어지면 거짓 통과(SD_04 §내부망 배치)
        location ~ ^/model-api(/|$) {
            types { } default_type application/problem+json;   # .json 확장자 MIME이 덮지 않게
            return 404 '{"type":"about:blank#not_found","title":"not_found","status":404,"code":"not_found","reason":"model_api_not_public"}';
        }
    }
}
