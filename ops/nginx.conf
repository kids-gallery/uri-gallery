# nginx 라우팅(T009, research R-02·R-06) — Homebrew nginx 네이티브. server 블록만 둔다(include로 불러 쓴다).
# TorchServe 8080~8082, Ollama 11434, llm-server 8200, /internal/* 는 내보내지 않는다(BR-SRV-04).
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /opt/homebrew/etc/nginx/uam.crt;   # 팀 서버 인증서로 교체
    ssl_certificate_key /opt/homebrew/etc/nginx/uam.key;
    client_max_body_size 21m;                               # 20MB + 여유(BR-INT-01)

    root /srv/uam/web/dist;
    location / { try_files $uri /index.html; }

    location /v1/models/ { proxy_pass http://127.0.0.1:8100; proxy_set_header X-Forwarded-For $remote_addr; }
    location ~ ^/(v1/|live$|ready$|openapi\.json$) { proxy_pass http://127.0.0.1:3000; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:3000; }
    location /internal/ { return 404; }

    # 가족 파일 — app-api가 X-Accel-Redirect로만 넘긴다(직접 접근 불가)
    location /_files/ { internal; alias /srv/uam/store/; }
}
