# TorchServe 설정 — M3 Animated Drawings(T081, research R-03). Docker 없이 네이티브 실행.
# 기동: conda activate serving/.venv-m3 && torchserve --start --ncs --ts-config ops/torchserve/config.properties \
#         --model-store "$MODEL_ROOT/m3/model-store" --models drawn_humanoid_detector.mar drawn_humanoid_pose_estimator.mar
# 보관 처리된 엔진(BR-MDL-06) — 루프백에만 연다. 관리 포트 9562는 외부로 내보내지 않는다(ops/nginx.conf).
inference_address=http://127.0.0.1:9561
management_address=http://127.0.0.1:9562
metrics_address=http://127.0.0.1:9563
# 기본값(CPU 코어 수만큼 워커)이면 모델 2종이 워커마다 따로 올라가 공유 호스트 메모리를 크게 쓴다 — 1로 고정
default_workers_per_model=1
load_models=all
# AD 스크립트(image_to_annotations.py)가 토큰 없이 부르므로 끈다 — 보호는 루프백 바인딩(R-03)
disable_token_authorization=true
enable_model_api=false
