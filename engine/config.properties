# 컨테이너용 TorchServe 설정(SD_04 10-1). 팀 서버 설정(ops/torchserve/config.properties)과 같은 포트 번호를 쓰되
# 추론 포트만 컨테이너 안쪽 망(back)에 연다. 관리·지표 포트는 컨테이너 안에서만.
inference_address=http://0.0.0.0:9561
management_address=http://127.0.0.1:9562
metrics_address=http://127.0.0.1:9563
grpc_inference_port=9564
grpc_management_port=9565
model_store=/home/torchserve/model-store
load_models=all
default_workers_per_model=1
