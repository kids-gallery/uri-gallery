# 실제 모델 켜기(마스터플랜 3-5 3·4번, #42). 기본 compose.yaml은 가짜 모델 그대로 둔다.
#   docker compose -f compose.yaml -f compose.real.yaml up -d --build
# 가중치는 저장소에 없다. models/manifest.yaml의 source·revision으로 받아 models/hf에 둔다.
# M3·M7은 가짜 어댑터로 둔다. 메모리는 맥 측정값(memory.peak 8.09~8.35GiB, 마스터플랜 7절)보다 여유 있게 잡았다.
services:
  db-migrate:
    environment:
      DEV_REAL_MODELS: "M1,M2,M5" # 매니페스트 값으로 활성 행을 만든다(마스터플랜 3-5 1번)
  model-api:
    environment:
      UAM_FAKE_MODELS: "M3,M7"
  worker-cpu:
    image: uri-gallery-serving-models:local
    build:
      args:
        INSTALL_MODELS: "1"
    environment:
      UAM_FAKE_MODELS: "M3,M7"
      MODEL_ROOT: /models
      HF_HOME: /data/hf-cache
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./models/hf:/models/hf:ro
      - hf-cache:/data/hf-cache
    mem_limit: 10g
volumes:
  hf-cache:
