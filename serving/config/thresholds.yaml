# 품질 임계값 — U5 확정 전에는 "명백한 실패"만 quality_below로 본다(FR-15). [추론]
split:
  min_foreground_ratio: 0.02   # 마스크 전경이 2% 미만이면 분리 실패(split_fail)
  max_foreground_ratio: 0.98   # 98% 초과면 배경을 못 뗀 것
judge:
  min_kind_score: 0.0          # 점수 단독으로 판정하지 않는다(BR-SUG-04). 기록만
animate_render:
  min_output_bytes: 1024       # 렌더 결과가 비었으면 품질 미달
depth_relief:
  min_depth_std: 0.5           # 깊이맵이 평평하면(표준편차 < 0.5/65535 단위 아님, 0~255 정규화 기준) 품질 미달
